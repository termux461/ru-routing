name: Discover new service domains
on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['bin/discover.php', 'src/Catalog.php', '.github/workflows/discover.yml']
permissions:
  contents: write
concurrency:
  group: routing-lists
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl
          coverage: none
      - run: php tests/run.php
      - run: php bin/discover.php
      - name: Check for new domains
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- sources/domains.txt)" ]; then
            echo 'found=false' >> "$GITHUB_OUTPUT"
          else
            echo 'found=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build and verify updated lists
        if: steps.changes.outputs.found == 'true'
        run: |
          php bin/build.php
          php tests/artifacts.php
      - name: Commit catalog, queue, and lists
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/domains.txt dist/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: add discovered service domains'
          git push origin HEAD:main
