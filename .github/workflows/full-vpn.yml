name: Update expanded VPN services
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/IPListSnapshot.php', 'bin/build-full-vpn.php', 'tests/full-vpn.php', '.github/workflows/full-vpn.yml']
permissions:
  contents: write
concurrency:
  group: routing-lists
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl
          coverage: none
      - run: php tests/full-vpn.php
      - run: php bin/build-full-vpn.php
      - name: Commit expanded data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/full-*.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh expanded VPN service data'
            git push origin HEAD:main
          fi
