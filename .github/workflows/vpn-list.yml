name: Update VPN-only lists
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['sources/vpn-services.json', 'src/VpnCatalog.php', 'bin/build-vpn.php', 'tests/vpn.php', 'tests/vpn-artifacts.php', '.github/workflows/vpn-list.yml']
permissions:
  contents: write
concurrency:
  group: routing-lists
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl
          coverage: none
      - run: php tests/vpn.php
      - run: php bin/build-vpn.php
      - run: php tests/vpn-artifacts.php
      - name: Commit updated VPN lists
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/vpn-*
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh VPN-only lists'
            git push origin HEAD:main
          fi
